<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title description">
  <title id="title">Global proxy routing and independently selected egress IPs</title>
  <desc id="description">A user configures a ForwardProxy, access, profiles, and permitted locations. GSLB resolves the global hostname to an eligible regional proxy endpoint. Applications connect directly to that endpoint, not through GSLB. Regional proxy fleets authenticate clients and forward traffic through a selected datacenter or residential supplier pool. Destination services see the exit IP. Explicit regional hostnames bypass global location selection. Dashed arrows show configuration or DNS resolution and solid arrows show application traffic. Addresses are illustrative.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-size: 19px; font-weight: 700; }
    .detail { font-size: 16px; fill: #475569; }
    .edge { font-size: 15px; fill: #334155; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .control { stroke-dasharray: 6 5; }
  </style>
  <rect width="960" height="690" fill="white"/>
  <rect x="252" y="20" width="278" height="576" rx="12" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
  <text x="276" y="53" class="heading">Datum Cloud</text>
  <rect x="32" y="82" width="178" height="92" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="121" y="115" class="label" text-anchor="middle">User or platform</text>
  <text x="121" y="144" class="detail" text-anchor="middle">Customer project</text>
  <rect x="276" y="82" width="230" height="122" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="391" y="114" class="label" text-anchor="middle">ForwardProxy</text>
  <text x="391" y="143" class="detail" text-anchor="middle">Profiles and access</text>
  <text x="391" y="168" class="detail" text-anchor="middle">Permitted locations</text>
  <text x="391" y="191" class="detail" text-anchor="middle">Endpoints and status</text>
  <path d="M 210 128 L 276 128" class="line control"/>
  <text x="243" y="112" class="edge" text-anchor="middle">Create</text>
  <path d="M 391 204 L 391 310" class="line control"/>
  <text x="406" y="265" class="edge">Configure</text>
  <rect x="32" y="220" width="178" height="108" rx="10" fill="#f5f3ff" stroke="#a99ad1" stroke-width="1.5"/>
  <text x="121" y="250" class="label" text-anchor="middle">GSLB / DNS</text>
  <text x="121" y="278" class="detail" text-anchor="middle">Global hostname</text>
  <text x="121" y="305" class="detail" text-anchor="middle">Eligible location</text>
  <path d="M 276 182 L 234 182 L 234 270 L 210 270" class="line control"/>
  <rect x="32" y="400" width="178" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="121" y="434" class="label" text-anchor="middle">Applications</text>
  <text x="121" y="464" class="detail" text-anchor="middle">Browsers and workers</text>
  <text x="121" y="490" class="detail" text-anchor="middle">On Datum or elsewhere</text>
  <path d="M 121 400 L 121 328" class="line control" marker-start="url(#arrow)"/>
  <text x="137" y="365" class="edge">Resolve</text>
  <rect x="276" y="310" width="230" height="252" rx="10" fill="white" stroke="#5b89c4" stroke-width="2"/>
  <text x="391" y="341" class="label" text-anchor="middle">Regional proxy fleets</text>
  <rect x="294" y="360" width="194" height="72" rx="8" fill="#eff6ff" stroke="#93b4df"/>
  <text x="391" y="389" class="label" text-anchor="middle">Location A</text>
  <text x="391" y="415" class="detail" text-anchor="middle">Authenticate and select</text>
  <rect x="294" y="464" width="194" height="72" rx="8" fill="#eff6ff" stroke="#93b4df"/>
  <text x="391" y="493" class="label" text-anchor="middle">Location B</text>
  <text x="391" y="519" class="detail" text-anchor="middle">Authenticate and select</text>
  <path d="M 210 448 L 276 448" class="line"/>
  <text x="121" y="553" class="detail" text-anchor="middle">Connect to chosen endpoint</text>
  <text x="121" y="578" class="detail" text-anchor="middle">Or use regional hostname</text>
  <rect x="570" y="310" width="216" height="120" rx="10" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
  <text x="678" y="343" class="label" text-anchor="middle">Datacenter exits</text>
  <text x="678" y="372" class="detail" text-anchor="middle">Supplier pool</text>
  <text x="678" y="401" class="detail" text-anchor="middle">e.g. 192.0.2.10</text>
  <rect x="570" y="480" width="216" height="120" rx="10" fill="#fff7ed" stroke="#d9ae77" stroke-width="1.5"/>
  <text x="678" y="513" class="label" text-anchor="middle">Residential exits</text>
  <text x="678" y="542" class="detail" text-anchor="middle">Supplier pool</text>
  <text x="678" y="571" class="detail" text-anchor="middle">e.g. 198.51.100.20</text>
  <path d="M 506 448 L 546 448" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 546 448 L 546 370 L 570 370" class="line"/>
  <path d="M 546 448 L 546 540 L 570 540" class="line"/>
  <text x="678" y="269" class="edge" text-anchor="middle">Profile selects exit geography</text>
  <text x="678" y="291" class="edge" text-anchor="middle">Independent of proxy location</text>
  <rect x="824" y="396" width="116" height="124" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="882" y="427" class="label" text-anchor="middle">Destination</text>
  <text x="882" y="453" class="label" text-anchor="middle">services</text>
  <text x="882" y="490" class="detail" text-anchor="middle">See exit IP</text>
  <path d="M 786 370 L 805 370 L 805 430 L 824 430" class="line"/>
  <path d="M 786 540 L 805 540 L 805 488 L 824 488" class="line"/>
  <text x="32" y="643" class="detail">Dashed: configuration / DNS · Solid: application traffic · Addresses are illustrative</text>
  <text x="32" y="669" class="detail">GSLB selects a connection location; it neither carries traffic nor moves established tunnels.</text>
</svg>
